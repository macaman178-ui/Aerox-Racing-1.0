<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Retro Arcade Racer</title>
                <style>
                        body {
                                        margin: 0;
                                                    background-color: #1a1a1a;
                                                                color: #fff;
                                                                            font-family: Arial, sans-serif;
                                                                                        display: flex;
                                                                                                    flex-direction: column;
                                                                                                                align-items: center;
                                                                                                                            justify-content: center;
                                                                                                                                        min-height: 100vh;
                                                                                                                                                    overflow: hidden;
                                                                                                                                                                user-select: none;
                        }
                                #game-container {
                                                position: relative;
                                                            width: 360px;
                                }
                                        canvas {
                                                        display: block;
                                                                    background-color: #2d6a4f; /* Default grass fallback */
                                                                                border-radius: 12px;
                                        }
                                                #controls {
                                                                width: 360px;
                                                                            margin-top: 15px;
                                                                                        display: flex;
                                                                                                    flex-direction: column;
                                                                                                                gap: 12px;
                                                                                                                            padding: 0 5px;
                                                                                                                                        box-sizing: border-box;
                                                }
                                                        .row {
                                                                        display: flex;
                                                                                    gap: 12px;
                                                        }
                                                                .btn {
                                                                                flex: 1;
                                                                                            padding: 16px;
                                                                                                        background: #333;
                                                                                                                    border: none;
                                                                                                                                border-radius: 8px;
                                                                                                                                            color: white;
                                                                                                                                                        font-size: 16px;
                                                                                                                                                                    font-weight: bold;
                                                                                                                                                                                cursor: pointer;
                                                                                                                                                                                            box-shadow: 0 4px #222;
                                                                }
                                                                        .btn:active {
                                                                                        transform: translateY(2px);
                                                                                                    box-shadow: 0 2px #222;
                                                                        }
                                                                                #nitroBtn {
                                                                                                background: #ff4d4d;
                                                                                                            box-shadow: 0 5px #b32424;
                                                                                                                        padding: 18px;
                                                                                                                                    font-size: 16px;
                                                                                                                                                letter-spacing: 1px;
                                                                                }
                                                                                        #nitroBtn:active {
                                                                                                        background: #ff3333;
                                                                                                                    transform: translateY(3px);
                                                                                                                                box-shadow: 0 2px #b32424;
                                                                                        }
                                                                                            </style>
                                                                                            </head>
                                                                                            <body>

                                                                                            <div id="game-container">
                                                                                                <canvas id="gameCanvas" width="360" height="500"></canvas>
                                                                                                </div>

                                                                                                <div id="controls">
                                                                                                    <div class="row">
                                                                                                            <button class="btn" id="leftBtn">◀ LEFT</button>
                                                                                                                    <button class="btn" id="rightBtn">RIGHT ▶</button>
                                                                                                                        </div>
                                                                                                                            <button class="btn" id="nitroBtn">HOLD FOR NITRO ⚡</button>
                                                                                                                            </div>

                                                                                                                            <script>
                                                                                                                                const canvas = document.getElementById('gameCanvas');
                                                                                                                                    const ctx = canvas.getContext('2d');

                                                                                                                                        // Layout configuration
                                                                                                                                            const roadWidth = 220;
                                                                                                                                                const roadX = (canvas.width - roadWidth) / 2;
                                                                                                                                                    
                                                                                                                                                        // Game variables (Tuned down for fewer obstacles)
                                                                                                                                                            let normalSpeed = 4;
                                                                                                                                                                let nitroSpeed = 8;
                                                                                                                                                                    let currentSpeed = normalSpeed;
                                                                                                                                                                        
                                                                                                                                                                            let score = 0;
                                                                                                                                                                                let coins = 0;
                                                                                                                                                                                    let gameOver = false;
                                                                                                                                                                                        let frameCount = 0;

                                                                                                                                                                                            // Entity lists
                                                                                                                                                                                                let roadLines = [0, 80, 160, 240, 320, 400, 480];
                                                                                                                                                                                                    let obstacles = [];
                                                                                                                                                                                                        let items = []; // Coins
                                                                                                                                                                                                            let trees = [
                                                                                                                                                                                                                        { x: roadX - 30, y: 60 },
                                                                                                                                                                                                                                { x: roadX - 25, y: 260 },
                                                                                                                                                                                                                                        { x: roadX - 35, y: 420 },
                                                                                                                                                                                                                                                { x: roadX + roadWidth + 20, y: 140 },
                                                                                                                                                                                                                                                        { x: roadX + roadWidth + 15, y: 340 }
                                                                                                                                                                                                            ];

                                                                                                                                                                                                                // Player (Red car at the bottom center)
                                                                                                                                                                                                                    const player = {
                                                                                                                                                                                                                                x: canvas.width / 2 - 15,
                                                                                                                                                                                                                                        y: canvas.height - 90,
                                                                                                                                                                                                                                                width: 30,
                                                                                                                                                                                                                                                        height: 55,
                                                                                                                                                                                                                                                                color: '#ff4d4d',
                                                                                                                                                                                                                                                                        speed: 5
                                                                                                                                                                                                                    };

                                                                                                                                                                                                                        const obstacleColors = ['#00bbf9', '#9b5de5', '#00f5d4'];
                                                                                                                                                                                                                            let keys = { Left: false, Right: false, Nitro: false };

                                                                                                                                                                                                                                // Event Listeners for Controls
                                                                                                                                                                                                                                    window.addEventListener('keydown', (e) => {
                                                                                                                                                                                                                                                if (e.key === 'ArrowLeft' || e.key === 'a') keys.Left = true;
                                                                                                                                                                                                                                                        if (e.key === 'ArrowRight' || e.key === 'd') keys.Right = true;
                                                                                                                                                                                                                                                                if (e.key === ' ') keys.Nitro = true;
                                                                                                                                                                                                                                    });
                                                                                                                                                                                                                                        window.addEventListener('keyup', (e) => {
                                                                                                                                                                                                                                                    if (e.key === 'ArrowLeft' || e.key === 'a') keys.Left = false;
                                                                                                                                                                                                                                                            if (e.key === 'ArrowRight' || e.key === 'd') keys.Right = false;
                                                                                                                                                                                                                                                                    if (e.key === ' ') keys.Nitro = false;
                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                            // Button touch/mouse handlers
                                                                                                                                                                                                                                                const setupBtn = (btn, action) => {
                                                                                                                                                                                                                                                            btn.addEventListener('mousedown', () => keys[action] = true);
                                                                                                                                                                                                                                                                    btn.addEventListener('mouseup', () => keys[action] = false);
                                                                                                                                                                                                                                                                            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[action] = true; });
                                                                                                                                                                                                                                                                                    btn.addEventListener('touchend', () => keys[action] = false);
                                                                                                                                                                                                                                                };
                                                                                                                                                                                                                                                    setupBtn(document.getElementById('leftBtn'), 'Left');
                                                                                                                                                                                                                                                        setupBtn(document.getElementById('rightBtn'), 'Right');
                                                                                                                                                                                                                                                            setupBtn(document.getElementById('nitroBtn'), 'Nitro');

                                                                                                                                                                                                                                                                function spawnEntities() {
                                                                                                                                                                                                                                                                            const lanes = [roadX + 18, roadX + 95, roadX + 172];
                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                            // Spawn an obstacle car significantly less frequently (approx every 3-4 seconds)
                                                                                                                                                                                                                                                                                                    if (frameCount % 180 === 0 && obstacles.length < 2) {
                                                                                                                                                                                                                                                                                                                    let randomLane = lanes[Math.floor(Math.random() * lanes.length)];
                                                                                                                                                                                                                                                                                                                                let randomColor = obstacleColors[Math.floor(Math.random() * obstacleColors.length)];
                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                        obstacles.push({
                                                                                                                                                                                                                                                                                                                                                                            x: randomLane,
                                                                                                                                                                                                                                                                                                                                                                                            y: -60,
                                                                                                                                                                                                                                                                                                                                                                                                            width: 30,
                                                                                                                                                                                                                                                                                                                                                                                                                            height: 55,
                                                                                                                                                                                                                                                                                                                                                                                                                                            color: randomColor
                                                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                    // Spawn a coin occasionally
                                                                                                                                                                                                                                                                                                            if (frameCount % 130 === 0 && items.length < 2) {
                                                                                                                                                                                                                                                                                                                        let randomLane = lanes[Math.floor(Math.random() * lanes.length)] + 8; // center in lane
                                                                                                                                                                                                                                                                                                                                    // Make sure it doesn't drop exactly on top of an existing obstacle
                                                                                                                                                                                                                                                                                                                                                if (!obstacles.some(o => Math.abs(o.y - (-20)) < 80 && Math.abs(o.x - randomLane) < 20)) {
                                                                                                                                                                                                                                                                                                                                                                items.push({ x: randomLane + 7, y: -20, radius: 8 });
                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                            function drawCar(car, isPlayer = false) {
                                                                                                                                                                                                                                                                                                                                                                                                    // Main flat chassis block
                                                                                                                                                                                                                                                                                                                                                                                                            ctx.fillStyle = car.color;
                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.fillRect(car.x, car.y, car.width, car.height);

                                                                                                                                                                                                                                                                                                                                                                                                                            // Minimalist window strip
                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.fillStyle = isPlayer ? '#fff' : '#111';
                                                                                                                                                                                                                                                                                                                                                                                                                                            let windowY = isPlayer ? car.y + 12 : car.y + 35;
                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.fillRect(car.x + 4, windowY, car.width - 8, 8);
                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                            function drawTree(tree) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // Trunk
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.fillStyle = '#6c584c';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.fillRect(tree.x - 2, tree.y, 4, 14);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // Circular canopy
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.fillStyle = '#22573e';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.beginPath();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.arc(tree.x, tree.y, 12, 0, Math.PI * 2);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.fill();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function checkCollision(rect1, rect2) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return rect1.x < rect2.x + rect2.width &&
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           rect1.x + rect1.width > rect2.x &&
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          rect1.y < rect2.y + rect2.height &&
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         rect1.y + rect1.height > rect2.y;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 function update() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         if (gameOver) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     ctx.fillStyle = 'rgba(0,0,0,0.7)';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 ctx.fillRect(0, 0, canvas.width, canvas.height);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             ctx.fillStyle = '#fff';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         ctx.font = 'bold 24px Arial';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     ctx.fillText("GAME OVER", canvas.width/2 - 70, canvas.height/2);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 ctx.font = '14px Arial';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             ctx.fillText("Tap a direction button to restart", canvas.width/2 - 95, canvas.height/2 + 35);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     if (keys.Left || keys.Right) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     obstacles = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     items = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     score = 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     coins = 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     player.x = canvas.width / 2 - 15;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     gameOver = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             requestAnimationFrame(update);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         frameCount++;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 currentSpeed = keys.Nitro ? nitroSpeed : normalSpeed;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 if (frameCount % 5 === 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             score += keys.Nitro ? 2 : 1; // Double points during nitro execution
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             // 1. Draw Background Scenery
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     ctx.fillStyle = '#38761d'; // Grass sides
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             ctx.fillRect(0, 0, canvas.width, canvas.height);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             ctx.fillStyle = '#434343'; // Asphalt Road
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     ctx.fillRect(roadX, 0, roadWidth, canvas.height);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             // White solid track shoulders
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     ctx.fillStyle = '#fff';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             ctx.fillRect(roadX - 4, 0, 4, canvas.height);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     ctx.fillRect(roadX + roadWidth, 0, 4, canvas.height);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             // 2. Animate Road Marking Dashes
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     ctx.fillStyle = '#fff';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             for (let i = 0; i < roadLines.length; i++) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         roadLines[i] += currentSpeed;
